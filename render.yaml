services:
  - type: web
    name: finbot-backend
    env: python
    buildCommand: "cd app/backend && pip install -r requirements.txt"
    startCommand: "cd app/backend && bash start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_MODE
        value: url
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
